<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 of 13 ✨</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <div class="container">

        <!-- SCREEN 1 -->
        <div id="screen1" class="screen active">

            <h1>✨ June 13 is getting closer ✨</h1>

            <p>
                For the next 13 days,
                you'll receive a small surprise.
            </p>

            <button id="startBtn">
                Start
            </button>

        </div>

        <!-- SCREEN 2 -->
        <div id="screen2" class="screen">

            <h2>Touch the Star ⭐</h2>

            <div id="star" class="star">
                ⭐
            </div>

        </div>

        <!-- SCREEN 3 -->
        <div id="screen3" class="screen">

            <h2>🎁 Day 1 of 13</h2>

            <div class="message">

                <p>
                    One thing I appreciate about you:
                </p>

                <p class="special">
                    Your smile can brighten even the most ordinary day.
                </p>

            </div>

            <div id="countdown"></div>

            <p class="tomorrow">
                Come back tomorrow for another surprise ❤️
            </p>

            <div class="secret">
                Secret Word #1
                <br>
                <strong>YOU</strong>
            </div>

        </div>

    </div>

    <!-- MUSIC -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
