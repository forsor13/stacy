<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Day 8 🎁</title>

<link rel="stylesheet"
href="style.css">

</head>
<body>

<div class="container">

    <div id="screen1"
    class="screen active">

        <h1>🎁 Day 8 of 13 🎁</h1>

        <p class="intro">
            A small gift is waiting for you...
        </p>

        <button id="giftBtn">
            Open Gift 🎁
        </button>

    </div>

    <div id="screen2"
    class="screen">

        <h2>
            Touch the gift...
        </h2>

        <div id="giftBox"
        class="gift-box">

            🎁

        </div>

    </div>

    <div id="screen3"
    class="screen">

        <h2>
            🎉 Gift Opened
        </h2>

        <div class="message">

            <p>
                Day 8 of 13 ❤️
            </p>

            <p class="special">

                Sometimes the best gifts
                aren't wrapped in paper.

            </p>

            <p>

                They're the people who make
                life brighter simply by
                being part of it.

            </p>

        </div>

        <div id="countdown">

            5 days remaining...

        </div>

        <p class="tomorrow">

            See you tomorrow
            for Day 9 ✨

        </p>

        <div class="secret">

            Secret Word #8

            <br><br>

            <strong>HAVE</strong>

        </div>

    </div>

</div>

<audio id="bgMusic"
preload="auto"
loop>

<source
src="music.mp3"
type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>
</html>
